<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOOK UP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NOISE OVERLAY -->
  <div class="noise"></div>

  <!-- INTRO -->
  <section class="intro">
    <div class="intro-tag">New York, NY</div>
    <h1 class="intro-title">LOOK<br><em>UP</em></h1>
    <p class="intro-sub">A little archive of things we almost missed.</p>
    <p class="intro-desc">Photographs, thoughts, and small pauses left behind<br>by people moving through New York.</p>
    <a class="intro-cta" href="#stage">take a little look ↓</a>
  </section>

  <!-- MAIN STAGE -->
  <section class="stage" id="stage">

    <div class="stage-label">push the thoughts away</div>

    <!-- PHOTOS LAYER (behind) -->
    <div class="photos-layer" id="photosLayer">
      <!-- filled by JS -->
    </div>

    <!-- NOTES LAYER (on top, draggable) -->
    <div class="notes-layer" id="notesLayer">
      <!-- filled by JS -->
    </div>

  </section>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">✕</button>
    <div class="lightbox-inner">
      <img class="lightbox-img" id="lightboxImg" src="" alt="">
      <div class="lightbox-note">
        <div class="lightbox-time" id="lightboxTime"></div>
        <p class="lightbox-text" id="lightboxText"></p>
        <div class="lightbox-loc" id="lightboxLoc"></div>
      </div>
    </div>
    <button class="lightbox-next" id="lightboxNext">another moment →</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
